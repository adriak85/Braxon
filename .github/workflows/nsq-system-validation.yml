name: NSQ system validation

on:
  push:
    branches:
      - reconstruction
      - reconstruction-final-20260816
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete stack
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Workspace format gate
        run: cargo +1.96.0 fmt --all -- --check

      - name: Workspace compile gate
        run: cargo +1.96.0 check --workspace --all-targets --locked

      - name: Workspace test gate
        run: cargo +1.96.0 test --workspace --all-targets --locked

      - name: NSQ executable smoke gate
        run: |
          cargo +1.96.0 run --quiet -- status
          cargo +1.96.0 run --quiet -- apps verify
          cargo +1.96.0 run --quiet -- seating-verify
          cargo +1.96.0 run --quiet -- max-stable-scan
          cargo +1.96.0 run --quiet -- lever-sweet-spot
          cargo +1.96.0 run --quiet -- wake

      - name: Repository integrity gate
        run: |
          test -f RECONSTRUCTION_PROTOCOL.md
          test -f RECONSTRUCTION_STATE.json
          test -f Cargo.toml
          test -d crates/nsq-core
          test -d crates/braxon-core
