plugins {
    id 'com.android.application'
}

android {
    namespace 'im.braxon.android'
    compileSdk 36

    defaultConfig {
        applicationId 'im.braxon.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++20 -Wall -Wextra -Werror' }
        }
    }

    buildFeatures { prefab true }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }

    packaging {
        jniLibs { useLegacyPackaging false }
    }
}
