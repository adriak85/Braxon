[package]
publish = false
name = "Braxon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Root Braxon command center and seating verification entrance."

[[bin]]
name = "Braxon"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "crates/braxon-cli",
    "crates/braxon-core",
    "crates/braxon-court",
    "crates/braxon-ingest",
    "crates/braxon-kingdom-generate",
    "crates/braxon-showdown",
    "crates/nsq-archon",
    "crates/nsq-calibrate",
    "crates/nsq-cli",
    "crates/nsq-compose",
    "crates/nsq-compress",
    "crates/nsq-core",
    "crates/nsq-reflexor",
    "crates/nsq-citadel",
    "crates/nsq-system",
    "crates/wowas-final-edition-v10",
    "crates/nsqasm-stamp-db",
    "crates/nsq-grid",
    "crates/nsq-hot",
    "crates/nsq-wake",
    "nsq-unified",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Braxon-Private"
authors = ["Braxon Project"]
rust-version = "1.97.0"

[workspace.dependencies]
nsq-core = { path = "crates/nsq-core" }
nsq-reflexor = { path = "crates/nsq-reflexor" }
nsq-system = { path = "crates/nsq-system" }
blake3 = "1.8.5"
cargo_metadata = "0.19.2"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[dependencies]
BRAXON_core = { package = "Braxon-core", path = "crates/braxon-core" }
clap.workspace = true
nsq-core.workspace = true
nsq-reflexor.workspace = true
nsq-system.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
